name: daily-ticker

# Phase 4 스케줄러. GitHub-hosted runner 는 네트워크/브라우저 설치가 가능해
# 이 레포의 영상 파이프라인이 실제로 돈다(원격 샌드박스와 달리).
# 대안: Railway cron 에서 `npm ci && npx playwright install --with-deps chromium && npm run pipeline` 동일.

on:
  schedule:
    # 19:30 UTC = KST 04:30. cron 지연(최대 ~1h)이 있어도 06시 전에 끝나
    # Buffer 큐의 "그날 아침 7시" 슬롯에 당일 게시됨(하루 지연/요일 밀림 제거).
    - cron: "30 19 * * *"
  workflow_dispatch:        # 수동 실행
    inputs:
      mock:
        description: "fixtures 로 수집(키 없이)"
        type: boolean
        default: false
      publish:
        description: "강제 발행(오늘 이미 발행했어도 다시 발행)"
        type: boolean
        default: false
      watchlist:
        description: "테마 강제(요일 mon~sun 또는 jp/en). 비우면 오늘 요일 자동"
        type: choice
        options: ["", "mon", "tue", "wed", "thu", "fri", "sat", "sun", "jp", "en"]
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 렌더된 mp4 를 samples/ 에 커밋(재생용)
    concurrency:
      group: daily-ticker
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # 러너 디스크 확보(faststart 2-pass 저장 시 'No space left' 방지) — 미사용 대형 툴체인 제거
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: install chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: run pipeline
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
        run: |
          ARGS=""
          if [ "${{ inputs.mock }}" = "true" ]; then ARGS="$ARGS --mock"; fi
          # 요일별 테마(요일 = KST 게시일 기준. 04:30 KST 실행 → 그날 아침 7시 게시분).
          #   월 JP TOP / 화 EN TOP / 수 무버스 / 목 등급프리미엄 / 금 모던 / 토 피카츄·이브이 / 일 JPvsEN
          if [ -n "${{ inputs.watchlist }}" ]; then
            export WATCHLIST_FILE="data/watchlist.${{ inputs.watchlist }}.json"   # 수동 dispatch 강제(mon~sun/jp/en)
          else
            case "$(TZ=Asia/Seoul date +%u)" in   # 1=월 .. 7=일 (KST = 게시되는 날)
              1) WL=mon;; 2) WL=tue;; 3) WL=wed;; 4) WL=thu;; 5) WL=fri;; 6) WL=sat;; *) WL=sun;;
            esac
            export WATCHLIST_FILE="data/watchlist.$WL.json"
          fi
          echo "오늘 테마: $WATCHLIST_FILE"
          node scripts/pipeline.mjs $ARGS

      - name: upload mp4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticker-mp4
          path: |
            out/ticker.mp4
            out/caption.txt
          if-no-files-found: warn

      # 매일 렌더된 영상을 samples/ 로 커밋 → GitHub 에서 바로 재생/확인
      - name: publish playable mp4 to repo
        if: success()
        run: |
          mkdir -p samples
          cp out/ticker.mp4 samples/ticker-latest.mp4
          cp out/caption.txt samples/caption-latest.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 중복 발행 가드: 직전 발행일(KST) 을 보존해 발행 단계에서 비교(하루 1발행).
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          cat data/last-publish.txt 2>/dev/null > out/prev-publish.txt || echo none > out/prev-publish.txt
          if [ ! -f out/collect-stale.flag ]; then echo "$TODAY_KST" > data/last-publish.txt; fi
          # data/cards.json 도 커밋 → 실데이터 수집 성공분이 폴백 캐시가 됨(이미지 포함 18장 유지).
          # 폴백으로 돈 날엔 cards.json 이 그대로라 변화 없음(no-op).
          git add -f samples/ticker-latest.mp4 samples/caption-latest.txt data/cards.json data/history.json data/last-publish.txt
          git commit -m "chore: daily ticker mp4 (auto)" || { echo "변경 없음"; exit 0; }
          # push 전 최신 main 을 rebase + 재시도(재실행/동시성 충돌 방지)
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push 충돌 — 재시도 $i…"; sleep 3
          done
          echo "::error::git push 3회 실패"; exit 1

      # Buffer 발행. 기본=초안(saveToDraft). repo 변수 PUBLISH_LIVE=1 이면 실게시.
      - name: publish to Buffer
        if: success()
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
          BUFFER_MODE: addToQueue
          BUFFER_SAVE_DRAFT: ${{ vars.PUBLISH_LIVE == '1' && '0' || '1' }}
        run: |
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then echo "Buffer 미설정 — 발행 건너뜀"; exit 0; fi
          # 수집이 실패(HTTP 429/401 등)해 옛 데이터로 폴백한 날은 발행 건너뜀.
          # → 같은 영상이 매일 중복 업로드되는 것을 원천 차단(신선 데이터 있는 날만 발행).
          if [ -f out/collect-stale.flag ]; then
            echo "⚠ 수집 폴백(신선 시세 없음) — 중복 발행 건너뜀. 사유: $(cat out/collect-stale.flag)"
            echo "  PPT_API_KEY 크레딧/한도 확인 필요. 신선 수집되는 날 자동으로 재개됨."
            exit 0
          fi
          # 하루 1발행 가드: 오늘(KST) 이미 발행했으면 스킵(수동 재실행이 큐를 도배하는 것 방지).
          # 강제하려면 dispatch 입력 publish=true.
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          if [ "$(cat out/prev-publish.txt 2>/dev/null)" = "$TODAY_KST" ] && [ "${{ inputs.publish }}" != "true" ]; then
            echo "⚠ 오늘($TODAY_KST KST) 이미 발행됨 — 중복 발행 건너뜀 (강제: dispatch 의 publish=true)"
            exit 0
          fi
          # 커밋 SHA로 고정한 불변 URL 사용: 각 게시물이 그날 영상을 영구 참조(고정 URL 덮어쓰기 방지).
          SHA=$(git rev-parse HEAD)
          export PUBLISH_VIDEO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/samples/ticker-latest.mp4"
          echo "발행 영상 URL(SHA 고정): $PUBLISH_VIDEO_URL"
          node scripts/publish.mjs --confirm
